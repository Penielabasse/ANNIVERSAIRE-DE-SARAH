
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080414">

    <link rel="icon" href="fete.png" type="image/png">
    <title>Joyeux Anniversaire SARAH ✨</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --cyan: #00ffd5;
            --pink: #ff3cac;
            --gold: #ffd700;
            --blue: #685bff;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            overflow-x: hidden;
            background: radial-gradient(
                ellipse at 50% 35%,
                #281044 0%, #10091f 45%, #03030a 100%
            );
            color: white;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        /* LUMIÈRES D'AMBIANCE */

        .ambient {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .orb {
            position: absolute;
            width: 35vw;
            height: 35vw;
            min-width: 220px;
            min-height: 220px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.25;
            animation: float 9s ease-in-out infinite alternate;
        }

        .orb.one {
            top: -10%;
            left: -10%;
            background: var(--pink);
        }

        .orb.two {
            right: -10%;
            bottom: -10%;
            background: var(--blue);
            animation-delay: -4s;
        }

        .orb.three {
            width: 180px;
            height: 180px;
            top: 45%;
            left: 40%;
            background: var(--cyan);
            opacity: 0.12;
        }

        @keyframes float {
            to {
                transform: translate(40px, -30px) scale(1.15);
            }
        }

        /* PARTICULES */

        #particles {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* PAGE PRINCIPALE */

        .page {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(10px, 2vh, 20px);
            padding: 20px 16px;
            text-align: center;
        }

        .eyebrow {
            color: var(--cyan);
            text-transform: uppercase;
            letter-spacing: 0.3em;
            font-size: clamp(10px, 1.5vw, 13px);
            font-weight: 700;
            animation: appear 1s ease both;
        }

        h1 {
            max-width: 1000px;
            font-size: clamp(32px, 6.5vw, 76px);
            font-weight: 900;
            line-height: 1.05;
            text-transform: uppercase;
            letter-spacing: 0.025em;
            background: linear-gradient(
                110deg,
                #fff 5%,
                #ffb8e3 25%,
                var(--gold) 48%,
                #fff 65%,
                var(--cyan) 85%
            );
            background-size: 250% auto;
            color: transparent;
            background-clip: text;
            -webkit-background-clip: text;
            filter: drop-shadow(0 0 18px #ff3cac55);
            animation: shine 6s linear infinite, appear 1.2s ease both;
        }

        h1 span {
            display: block;
            margin-top: 5px;
            font-size: 1.15em;
            letter-spacing: 0.12em;
        }

        @keyframes shine {
            to { background-position: 250% center; }
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .ornament {
            color: var(--gold);
            font-size: 15px;
            letter-spacing: 0.4em;
        }

        .subtitle {
            max-width: 570px;
            color: #e4d9f5;
            font-size: clamp(12px, 1.8vw, 16px);
            line-height: 1.6;
        }

        /* CADRE VIDÉO NÉON */

        .video-frame {
            position: relative;
            width: min(88vw, 820px);
            padding: 4px;
            border-radius: 20px;
            background: conic-gradient(
                from var(--angle, 0deg),
                var(--cyan),
                var(--blue),
                var(--pink),
                var(--gold),
                var(--cyan)
            );
            box-shadow:
                0 0 18px #00ffd555,
                0 0 42px #ff3cac44,
                0 0 80px #685bff22;
            animation: rotateGlow 5s linear infinite;
        }

        @property --angle {
            syntax: "<angle>";
            initial-value: 0deg;
            inherits: false;
        }

        @keyframes rotateGlow {
            to { --angle: 360deg; }
        }

        .video-inner {
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            background: #05030b;
        }

        video {
            display: block;
            width: 100%;
            height: min(49svh, 460px);
            object-fit: contain;
            background: #05030b;
        }

        /* BOUTON D'ACTIVATION DU SON */

        .sound-overlay {
            position: absolute;
            inset: 0;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 20px;
            background: #05030b99;
            backdrop-filter: blur(3px);
        }

        .sound-overlay[hidden] {
            display: none;
        }

        .sound-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px 23px;
            border: 1px solid #ffffff88;
            border-radius: 50px;
            background: linear-gradient(110deg, #ff3cac, #685bff);
            color: white;
            font-size: clamp(12px, 2vw, 15px);
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 0 25px #ff3cac77;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .sound-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px #00ffd588;
        }

        .sound-button:focus-visible {
            outline: 3px solid var(--cyan);
            outline-offset: 5px;
        }

        .sound-message {
            max-width: 300px;
            color: white;
            font-size: 12px;
            line-height: 1.6;
        }

        .bottom-line {
            width: min(200px, 50%);
            height: 2px;
            background: linear-gradient(
                90deg, transparent, var(--pink), var(--cyan), transparent
            );
            box-shadow: 0 0 15px var(--pink);
            animation: pulse 2s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            to {
                opacity: 1;
                transform: scaleX(1);
            }
            from {
                opacity: 0.5;
                transform: scaleX(0.75);
            }
        }

        footer {
            color: #b8a8d0;
            font-size: 10px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        footer span {
            color: var(--pink);
        }

        /* RESPONSIVE */

        @media (max-width: 600px) {
            .page {
                gap: 13px;
                padding: 18px 12px;
            }

            .eyebrow {
                letter-spacing: 0.18em;
            }

            h1 {
                font-size: clamp(29px, 8.5vw, 46px);
            }

            .subtitle {
                font-size: 12px;
                max-width: 340px;
            }

            .video-frame {
                width: 100%;
                padding: 3px;
                border-radius: 15px;
            }

            .video-inner {
                border-radius: 12px;
            }

            video {
                height: min(43svh, 390px);
                width: 100%;
                object-fit: contain;
            }

            .sound-button {
                padding: 13px 17px;
            }

            .orb {
                filter: blur(55px);
            }

            footer {
                font-size: 9px;
                letter-spacing: 0.1em;
            }
        }

        @media (max-height: 700px) and (min-width: 601px) {
            .page {
                gap: 9px;
                padding: 12px;
            }

            video {
                height: 42svh;
            }

            h1 {
                font-size: clamp(28px, 5vw, 52px);
            }

            .subtitle {
                font-size: 12px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .orb, h1, .video-frame, .bottom-line, .eyebrow {
                animation: none !important;
            }
        }
    </style>
</head>

<body>
    <div class="ambient" aria-hidden="true">
        <div class="orb one"></div>
        <div class="orb two"></div>
        <div class="orb three"></div>
    </div>

    <canvas id="particles" aria-hidden="true"></canvas>

    <main class="page">
        <p class="eyebrow">✦ Un jour exceptionnel ✦</p>

        <h1>
            Joyeux anniversaire
            <span>SARAH</span>
        </h1>

        <div class="ornament" aria-hidden="true">✧ ✦ ✧</div>

        <p class="subtitle">
            Que cette journée soit parée de lumière,
            couronnée de bonheur et illuminée par mille
            et une merveilles. ✨
        </p>

        <div class="video-frame">
            <div class="video-inner">

                <video
                    id="birthdayVideo"
                    src="SHAYANE.mp4"
                    autoplay
                    muted
                    loop
                    playsinline
                    preload="auto"
                    aria-label="Vidéo d'anniversaire de Sarah">
                    Votre navigateur ne peut pas lire cette vidéo.
                </video>

                <div class="sound-overlay" id="soundOverlay">
                    <button
                        type="button"
                        class="sound-button"
                        id="soundButton">
                        🎵 Activer le son et commencer
                    </button>

                    <p class="sound-message" id="soundMessage">
                        Prépare-toi à découvrir ta surprise ✨
                    </p>
                </div>

            </div>
        </div>

        <div class="bottom-line"></div>

        <footer>
            Fait avec <span>♥</span> pour SARAH
        </footer>
    </main>

    <script>
        // ======================================
        // VIDÉO : AUTOPLAY ET ACTIVATION DU SON
        // ======================================

        const video = document.getElementById("birthdayVideo");
        const overlay = document.getElementById("soundOverlay");
        const soundButton = document.getElementById("soundButton");
        const soundMessage = document.getElementById("soundMessage");

        // Le navigateur autorise plus facilement l'autoplay muet.
        // On tente d'abord la lecture avec le son.
        async function startVideo() {
            video.muted = false;
            video.volume = 1;

            try {
                await video.play();

                // Lecture sonore autorisée par le navigateur.
                overlay.hidden = true;
            } catch (error) {
                // Si le son est bloqué, on lance la vidéo en muet.
                video.muted = true;

                try {
                    await video.play();
                    soundMessage.textContent =
                        "Appuie sur le bouton pour entendre la musique et le son.";
                } catch (playError) {
                    // Si même la lecture muette est bloquée,
                    // le bouton permettra de lancer la vidéo.
                    soundMessage.textContent =
                        "Appuie pour lancer la vidéo avec le son.";
                }

                overlay.hidden = false;
            }
        }

        // Un clic de l'utilisateur autorise généralement le son.
        soundButton.addEventListener("click", async () => {
            soundButton.disabled = true;
            soundButton.textContent = "✨ Lancement...";

            video.muted = false;
            video.volume = 1;

            try {
                await video.play();
                overlay.hidden = true;
            } catch (error) {
                video.muted = true;

                soundButton.disabled = false;
                soundButton.textContent = "🔊 Réessayer avec le son";

                soundMessage.textContent =
                    "La lecture a été bloquée. Vérifie que le fichier vidéo est accessible puis réessaie.";
            }
        });

        // Tentative dès que le navigateur est prêt.
        if (video.readyState >= 2) {
            startVideo();
        } else {
            video.addEventListener("canplay", startVideo, { once: true });
        }

        video.addEventListener("error", () => {
            overlay.hidden = false;
            soundMessage.textContent =
                "Vidéo introuvable : vérifie le nom et l'emplacement de SHAYANE.mp4.";
            soundButton.textContent = "Vérifier la vidéo";
        });

        // ======================================
        // PARTICULES LUMINEUSES
        // ======================================

        const canvas = document.getElementById("particles");
        const ctx = canvas.getContext("2d");

        let width = 0;
        let height = 0;
        let particles = [];
        let animationId = null;

        const reducedMotion = window.matchMedia(
            "(prefers-reduced-motion: reduce)"
        );

        function resizeCanvas() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);

            width = window.innerWidth;
            height = window.innerHeight;

            canvas.width = Math.round(width * dpr);
            canvas.height = Math.round(height * dpr);
            canvas.style.width = width + "px";
            canvas.style.height = height + "px";

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            const count = Math.min(
                85,
                Math.floor(width * height / 11000)
            );

            particles = Array.from({ length: count }, () => ({
                x: Math.random() * width,
                y: Math.random() * height,
                radius: Math.random() * 1.7 + 0.5,
                speed: Math.random() * 0.4 + 0.1,
                phase: Math.random() * Math.PI * 2,
                color: [
                    "#ffffff",
                    "#00ffd5",
                    "#ff3cac",
                    "#ffd700"
                ][Math.floor(Math.random() * 4)]
            }));
        }

        function drawParticles(time = 0) {
            ctx.clearRect(0, 0, width, height);

            particles.forEach(p => {
                p.y -= p.speed;

                if (p.y < -5) {
                    p.y = height + 5;
                    p.x = Math.random() * width;
                }

                const alpha = 0.3 + 0.7 * (
                    0.5 + 0.5 * Math.sin(
                        time * 0.0015 + p.phase
                    )
                );

                ctx.globalAlpha = alpha;
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = p.color;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;

            animationId = requestAnimationFrame(drawParticles);
        }

        function updateMotion() {
            if (reducedMotion.matches) {
                cancelAnimationFrame(animationId);
                ctx.clearRect(0, 0, width, height);
            } else if (animationId === null) {
                drawParticles();
            } else {
                cancelAnimationFrame(animationId);
                drawParticles();
            }
        }

        resizeCanvas();

        if (!reducedMotion.matches) {
            drawParticles();
        }

        window.addEventListener("resize", resizeCanvas);

        if (reducedMotion.addEventListener) {
            reducedMotion.addEventListener("change", updateMotion);
        }
    </script>
</body>
</html>
